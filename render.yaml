services:
  # 1. Dashboard-ul Streamlit (Interfața Web)
  - type: web
    name: nova-trade-dashboard
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0"
    autoDeploy: true

  # 2. Motorul de Trading (transformat în web service gratuit pentru a rula stabil)
  - type: web
    name: nova-trade-engine
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python engine.py"
    autoDeploy: true